<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#D64000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cardápio</title>
  <style>
    :root {
      --prim: #D64000;
      --prim-d: #B53500;
      --prim-l: #FF6B2B;
      --prim-bg: #FFF2EC;
      --green: #27AE60;
      --text: #1A1A1A;
      --muted: #777;
      --border: #E8E8E8;
      --card: #fff;
      --bg: #F6F6F6;
      --r: 18px;
      --shadow: 0 2px 16px rgba(0,0,0,0.07);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 480px;
      margin: 0 auto;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screens ── */
    .screen { display: none; min-height: 100dvh; }
    .screen.on {
      display: block;
      animation: fadeIn .18s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Loading ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 18px;
      color: var(--muted);
      font-size: 15px;
    }
    .spin {
      width: 44px; height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--prim);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Header ── */
    .hdr {
      background: var(--prim);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 80;
    }
    .hdr h1 { flex: 1; font-size: 18px; font-weight: 700; }
    .btn-back {
      background: rgba(255,255,255,.2);
      border: none; color: #fff;
      width: 38px; height: 38px;
      border-radius: 50%;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-cart {
      position: relative;
      background: rgba(255,255,255,.2);
      border: none; color: #fff;
      width: 38px; height: 38px;
      border-radius: 50%;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .badge {
      position: absolute; top: -3px; right: -3px;
      background: #fff; color: var(--prim);
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 11px; font-weight: 800;
      display: none; align-items: center; justify-content: center;
    }
    .badge.vis { display: flex; }

    /* ── HOME ── */
    .home-hero {
      width: 100%;
      line-height: 0;
    }
    .home-hero img {
      width: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      max-height: 200px;
    }

    .cats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 20px;
      margin-top: -24px;
    }
    .cat-card {
      background: var(--card);
      border-radius: var(--r);
      padding: 14px;
      text-align: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .13s, box-shadow .13s;
      border: 2.5px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 160px;
      overflow: hidden;
      position: relative;
    }
    .cat-card:active { transform: scale(.96); }
    .cat-card .c-emoji { font-size: 62px; display: block; margin-bottom: 8px; }
    .cat-card .c-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: calc(var(--r) - 2px);
    }
    .cat-card .c-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.18) 70%, transparent 100%);
      padding: 28px 10px 10px;
      border-radius: 0 0 calc(var(--r) - 2px) calc(var(--r) - 2px);
    }
    .cat-card .c-nome { font-size: 14px; font-weight: 800; line-height: 1.3; position: relative; z-index: 1; }
    .cat-card.has-img .c-nome { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
    .cat-card .c-qt { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .fab {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--prim);
      color: #fff; border: none;
      border-radius: 32px;
      padding: 0 20px 0 16px;
      height: 54px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(214,64,0,.45);
      z-index: 70;
      transition: transform .13s;
    }
    .fab.vis { display: flex; }
    .fab:active { transform: scale(.96); }
    .fab-ico { font-size: 22px; }

    /* ── PROGRESS BAR ── */
    .progress {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
    }
    .prg-step {
      display: flex; align-items: center; gap: 7px;
      flex-shrink: 0;
    }
    .prg-num {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 2.5px solid var(--border);
      color: var(--muted);
      font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .prg-label { font-size: 12px; font-weight: 700; color: var(--muted); transition: color .2s; }
    .prg-step.ativo .prg-num { border-color: var(--prim); background: var(--prim); color: #fff; }
    .prg-step.ativo .prg-label { color: var(--prim); }
    .prg-step.done .prg-num { border-color: var(--green); background: var(--green); color: #fff; }
    .prg-step.done .prg-label { color: var(--green); }
    .prg-line { flex: 1; height: 2.5px; background: var(--border); margin: 0 6px; transition: background .2s; }
    .prg-line.done { background: var(--green); }

    /* ── Section ── */
    .sec-title { padding: 22px 20px 6px; font-size: 22px; font-weight: 800; }
    .sec-sub { padding: 0 20px 18px; color: var(--muted); font-size: 14px; }

    /* ── Tamanhos ── */
    .tam-list { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
    .tam-card {
      background: var(--card);
      border-radius: var(--r);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all .15s;
    }
    .tam-card:active { transform: scale(.98); }
    .tam-card.sel { border-color: var(--prim); background: var(--prim-bg); }
    .tam-emoji { font-size: 34px; }
    .tam-info { flex: 1; }
    .tam-nome { font-size: 20px; font-weight: 800; }
    .tam-sabs { font-size: 12px; color: var(--muted, #888); margin-top: 3px; }
    .tam-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .tam-pizzas { font-size: 24px; letter-spacing: -10px; line-height: 1; padding-right: 4px; }
    .tam-preco { font-size: 16px; font-weight: 700; color: var(--prim); }

    /* ── Sabores ── */
    .sab-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
    .sab-card {
      background: var(--card);
      border-radius: var(--r);
      padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all .13s;
    }
    .sab-card:active { transform: scale(.98); }
    .sab-card.sel1 { border-color: var(--prim); background: var(--prim-bg); }
    .sab-card.sel2 { border-color: #FF8C42; background: #FFF5EE; }
    .sab-chk {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid var(--border);
      font-size: 11px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s;
      color: transparent;
    }
    .sab-card.sel1 .sab-chk { background: var(--prim); border-color: var(--prim); color: #fff; }
    .sab-card.sel2 .sab-chk { background: #FF8C42; border-color: #FF8C42; color: #fff; }
    .sab-card.sel3 { border-color: #7B1FA2; background: #F3E5F5; }
    .sab-card.sel3 .sab-chk { background: #7B1FA2; border-color: #7B1FA2; color: #fff; }
    .sab-card.sel4 { border-color: #27AE60; background: #F0FFF4; }
    .sab-card.sel4 .sab-chk { background: #27AE60; border-color: #27AE60; color: #fff; }
    .prop-toggle { display: flex; margin: 0 20px 12px; border: 2px solid var(--border); border-radius: 12px; overflow: hidden; }
    .prop-btn { flex: 1; padding: 10px; border: none; background: transparent; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
    .prop-btn.on { background: var(--prim); color: #fff; }
    .pizza-chart-wrap { display: flex; justify-content: center; padding: 10px 20px 4px; }
    .pizza-chart { width: 150px; height: 150px; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.18)); }
    .sab-info { flex: 1; min-width: 0; }
    .sab-img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .sab-nome { font-size: 15px; font-weight: 700; }
    .sab-desc { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sab-tag {
      background: #FF8C42; color: #fff;
      border-radius: 10px; padding: 2px 8px;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
    }

    .meia-banner {
      margin: 0 20px 16px;
      background: var(--prim-bg);
      border: 1.5px solid var(--prim);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px; color: var(--prim-d);
      display: flex; align-items: center; gap: 8px;
    }

    /* ── Borda ── */
    .borda-opts { padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
    .borda-card {
      background: var(--card);
      border-radius: var(--r);
      padding: 22px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all .15s;
    }
    .borda-card:active { transform: scale(.97); }
    .borda-card.sel { border-color: var(--prim); background: var(--prim-bg); }
    .borda-card .b-emoji { font-size: 46px; display: block; margin-bottom: 10px; }
    .borda-card .b-nome { font-size: 19px; font-weight: 800; }
    .borda-card .b-desc { font-size: 13px; color: var(--muted); margin-top: 5px; }
    .borda-card .b-preco { font-size: 15px; font-weight: 700; color: var(--prim); margin-top: 8px; }

    .borda-sab-title { padding: 20px 20px 12px; font-size: 17px; font-weight: 800; }
    .borda-sab-grid { padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .bsab-card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px 12px;
      text-align: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all .13s;
    }
    .bsab-card:active { transform: scale(.95); }
    .bsab-card.sel { border-color: var(--prim); background: var(--prim-bg); }
    .bsab-card .bs-emoji { font-size: 30px; display: block; margin-bottom: 8px; }
    .bsab-card .bs-nome { font-size: 13px; font-weight: 700; }

    /* ── Lista (não-pizza) ── */
    .item-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 11px; }
    .item-card {
      background: var(--card);
      border-radius: var(--r);
      padding: 14px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: var(--shadow);
    }
    .item-img {
      width: 80px; height: 80px; border-radius: 10px;
      object-fit: cover; flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-nome { font-size: 16px; font-weight: 700; }
    .item-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .item-preco { font-size: 15px; font-weight: 700; color: var(--prim); margin-top: 6px; }
    .btn-plus {
      background: var(--prim); color: #fff; border: none;
      width: 38px; height: 38px; border-radius: 50%;
      font-size: 24px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform .12s;
    }
    .btn-plus:active { transform: scale(.9); }

    /* ── Bottom action ── */
    .bot-action {
      position: fixed; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid var(--border);
      z-index: 60;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s ease;
    }
    .bot-action.auto-hidden {
      transform: translateX(-50%) translateY(110%);
      opacity: 0;
      pointer-events: none;
    }
    .btn-prim {
      width: 100%;
      background: var(--prim); color: #fff;
      border: none; border-radius: 16px;
      padding: 17px; font-size: 17px; font-weight: 700;
      cursor: pointer; transition: transform .12s, background .15s;
    }
    .btn-prim:active { transform: scale(.98); }
    .btn-prim:disabled { background: #ccc; cursor: default; }
    .pb90 { height: 90px; }

    /* ── Sacola ── */
    .empty-bag {
      text-align: center; padding: 60px 20px;
    }
    .empty-bag .e-ico { font-size: 72px; }
    .empty-bag h3 { font-size: 22px; font-weight: 800; margin: 14px 0 8px; }
    .empty-bag p { color: var(--muted); }
    .btn-outline {
      margin-top: 20px;
      width: 100%;
      background: transparent; color: var(--prim);
      border: 2px solid var(--prim);
      border-radius: 16px; padding: 15px;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .cart-items { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .ci {
      background: var(--card);
      border-radius: var(--r);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .ci-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .ci-thumb { width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); overflow: hidden; }
    .ci-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .ci-thumb-ico { font-size: 26px; line-height: 1; }
    .ci-body { flex: 1; min-width: 0; }
    .ci-nome { font-size: 16px; font-weight: 700; }
    .ci-preco { font-size: 16px; font-weight: 700; color: var(--prim); white-space: nowrap; }
    .ci-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ci-ctrl { display: flex; align-items: center; gap: 12px; }
    .btn-qty {
      background: var(--bg); border: none;
      width: 34px; height: 34px; border-radius: 50%;
      font-size: 18px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-qty.rm { background: #FFECEC; color: var(--prim); }
    .ci-n { font-size: 18px; font-weight: 800; min-width: 22px; text-align: center; }

    .resumo {
      background: var(--card);
      margin: 0 20px;
      border-radius: var(--r);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .res-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; }
    .res-line.tot { font-weight: 800; font-size: 18px; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; margin-bottom: 0; }

    /* ── Checkout ── */
    .ck-form { padding: 20px; padding-bottom: 160px; display: flex; flex-direction: column; gap: 22px; }
    .fg label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .inp {
      width: 100%; border: 2px solid var(--border);
      border-radius: 13px; padding: 14px 16px;
      font-size: 16px; outline: none;
      transition: border-color .15s;
      background: #fff; color: var(--text);
      font-family: inherit;
    }
    .inp:focus { border-color: var(--prim); }
    .toggle {
      display: flex; border-radius: 13px;
      overflow: hidden; border: 2px solid var(--border);
    }
    .tgl-btn {
      flex: 1; padding: 14px; border: none;
      background: transparent; font-size: 15px;
      font-weight: 600; cursor: pointer; transition: all .15s;
      font-family: inherit;
    }
    .tgl-btn.on { background: var(--prim); color: #fff; }
    .pag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pag-btn {
      border: 2.5px solid var(--border);
      background: #fff; border-radius: 13px;
      padding: 15px 10px; font-size: 14px;
      font-weight: 600; cursor: pointer;
      text-align: center; transition: all .15s;
      font-family: inherit;
    }
    .pag-btn .p-ico { font-size: 26px; display: block; margin-bottom: 5px; }
    .pag-btn.on { border-color: var(--prim); background: var(--prim-bg); color: var(--prim); }
    .btn-geo {
      margin-top: 10px;
      width: 100%;
      background: #F0F7FF;
      color: #1565C0;
      border: 2px solid #90CAF9;
      border-radius: 13px;
      padding: 13px 16px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .15s;
    }
    .btn-geo:active { transform: scale(.97); }
    .btn-geo.loading { background: #E3F2FD; color: #90CAF9; border-color: #BBDEFB; cursor: default; }
    .btn-geo.ok { background: #F0FFF4; color: #27AE60; border-color: #A5D6A7; }
    .btn-geo.err { background: #FFF3F0; color: var(--prim); border-color: #FFAB91; }
    .pix-box {
      background: #F0FFF6;
      border: 1.5px solid var(--green);
      border-radius: 13px; padding: 14px 16px;
      font-size: 13px; color: #1a5c37;
      white-space: pre-line; margin-top: 12px;
      line-height: 1.6;
    }

    /* ── Confirmação ── */
    .conf-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100dvh;
      padding: 40px 24px; text-align: center;
    }
    .check-ball {
      width: 120px; height: 120px; border-radius: 50%;
      background: linear-gradient(135deg, #27AE60, #2ECC71);
      display: flex; align-items: center; justify-content: center;
      font-size: 60px; margin-bottom: 28px;
      box-shadow: 0 8px 30px rgba(39,174,96,.35);
      animation: pop .4s ease .1s both;
    }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .conf-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .conf-sub { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
    .conf-num-box { background: var(--bg); border-radius: var(--r); padding: 20px 36px; margin-bottom: 24px; }
    .conf-num-lbl { font-size: 13px; color: var(--muted); }
    .conf-num-val { font-size: 44px; font-weight: 900; color: var(--prim); }
    .conf-msg { font-size: 14px; color: var(--muted); max-width: 280px; line-height: 1.7; margin-bottom: 32px; }

    /* ── Modal ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      display: flex; align-items: flex-end;
      z-index: 200;
      animation: fIn .2s ease;
    }
    @keyframes fIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-sheet {
      background: #fff;
      border-radius: 26px 26px 0 0;
      padding: 28px 20px 40px;
      width: 100%; max-width: 480px; margin: 0 auto;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-ico { font-size: 44px; text-align: center; margin-bottom: 10px; }
    .modal-title { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    .modal-sub { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 22px; }
    .modal-btns { display: flex; flex-direction: column; gap: 10px; }
    .btn-sec {
      width: 100%; background: transparent;
      color: var(--prim); border: 2px solid var(--prim);
      border-radius: 14px; padding: 14px;
      font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-ghost {
      width: 100%; background: transparent;
      color: var(--muted); border: none;
      border-radius: 14px; padding: 12px;
      font-size: 15px; cursor: pointer; font-family: inherit;
    }

    /* ── Troco ── */
    .troco-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .troco-btn { border: 2px solid var(--border); background: #fff; border-radius: 13px; padding: 12px 6px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; transition: all .15s; font-family: inherit; color: var(--text); line-height: 1.3; }

    /* ── Pizza description wrap ── */
    .sab-desc-wrap {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: normal;
      line-height: 1.4;
    }

    /* ── Promo Ticker ── */
    .promo-ticker {
      display: flex;
      align-items: stretch;
      background: #1a1a1a;
      overflow: hidden;
      height: 40px;
      flex-shrink: 0;
    }
    .promo-ticker-brand {

      gap: 5px;

      align-items: center;

      display: inline-flex;

      align-items: center;

      font-weight: 700;

    .promo-ticker-cta:active { background: rgba(255,255,255,.18); }
    @keyframes ticker-roll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ── Promo Modal ── */
    #promo-modal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    #promo-modal.on { display: flex; }
    .promo-modal-sheet {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      animation: slideUp .28s cubic-bezier(.2,1,.3,1);

    .promo-modal-hdr {
      padding: 16px 20px 12px;

    /* ── Toast ── */

    #toast.vis { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

<script>
const SLUG = new URLSearchParams(location.search).get('slug');
if (!SLUG) { document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:18px;color:#999">Slug não informado.</div>'; throw 0; }

// ── Estado global ────────────────────────────────────────────────────────────
let _listaScrollOff = null;
const G = {
  rest: null, cardapio: [], moeda: 'G$',
  catAtual: null,
  // builder
  passo: 1, temBorda: false, builderItemImg: null,
  pizza: { tamanho: null, sabores: [], borda: false, saborBorda: null, precoBorda: 0, maxSabores: 2, proporcao: 'igual' },
  // carrinho
  cart: [],
  // checkout
  entrega: 'delivery', pagamento: '', geoLink: null, geoAddr: null, troco: null,
};

// ── Utilitários ──────────────────────────────────────────────────────────────
function fmt(v) {
  if (v == null) return '';
  const n = Number(v);
  if (['R$','€','US$'].some(p => G.moeda.startsWith(p)))
    return `${G.moeda} ${n.toFixed(2).replace('.', ',')}`;
  return `${G.moeda} ${n.toLocaleString('pt-BR')}`;
}

function toast(msg, ms = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('vis');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('vis'), ms);
}

function ir(tela) {
  if (_listaScrollOff) { _listaScrollOff(); _listaScrollOff = null; }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(`s-${tela}`).classList.add('on');
  sync();
  if (tela === 'sacola') renderSacola();
  if (tela === 'checkout') renderCkResumo();
  window.scrollTo(0, 0);
  if (tela === 'lista') {
    const bar = document.getElementById('lista-bot-action');
    const pb = document.querySelector('#s-lista .pb90');
    bar.classList.add('auto-hidden');
    requestAnimationFrame(() => {
      if (pb) pb.style.height = bar.offsetHeight + 'px';
    });
    let lastY = 0;
    function onScroll() {
      const y = document.documentElement.scrollTop || document.body.scrollTop || window.pageYOffset || 0;
      if (y < lastY) {
        bar.classList.add('auto-hidden');
      } else if (y > lastY && y > 250) {
        bar.classList.remove('auto-hidden');
      }
      lastY = y;
    }
    document.addEventListener('scroll', onScroll, { passive: true, capture: true });
    _listaScrollOff = () => document.removeEventListener('scroll', onScroll, { capture: true });
  } else if (tela === 'builder') {
    // Botão sempre visível no builder (wizard de pizza tem conteúdo curto)
    const bar = document.querySelector('#s-builder .bot-action');
    const pb = document.querySelector('#s-builder .pb90');
    bar.classList.remove('auto-hidden');
    requestAnimationFrame(() => {
      if (pb) pb.style.height = bar.offsetHeight + 'px';
    });
  }
}

function sync() {
  const total = G.cart.reduce((a, i) => a + i.qt, 0);
  ['bld-badge','lista-badge'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.textContent = total; el.classList.toggle('vis', total > 0); }
  });
  const fab = document.getElementById('fab');
  if (total > 0) {
    fab.classList.add('vis');
    document.getElementById('fab-txt').textContent = `Ver meu pedido (${total})`;
  } else {
    fab.classList.remove('vis');
  }
  const listaFin = document.getElementById('lista-fin-btn');
  if (listaFin) {
    listaFin.disabled = total === 0;
    listaFin.textContent = total > 0 ? `Finalizar (${total}) →` : 'Finalizar pedido →';
  }
}

// ── Emojis ───────────────────────────────────────────────────────────────────
const CAT_STYLES = [
  { keys:['pizza'],          emoji:'🍕', grad:'135deg,#c0392b,#e74c3c,#e67e22' },
  { keys:['helad','sorvete','ice'],  emoji:'🍦', grad:'135deg,#a78bfa,#60a5fa,#93c5fd' },
  { keys:['burguer','burger','hamburgu','hamburgue','legend','spice'], emoji:'🍔', grad:'135deg,#92400e,#b45309,#d97706' },
  { keys:['bebida','drink','refrig','suco','jugo','juice','cerveza','cerveja','destilado'], emoji:'🥤', grad:'135deg,#0ea5e9,#06b6d4,#67e8f9' },
  { keys:['cerveza','cerveja','beer'], emoji:'🍺', grad:'135deg,#b45309,#d97706,#fbbf24' },
  { keys:['destilado','whisky','vodka','gin','rum'], emoji:'🥃', grad:'135deg,#374151,#6b7280,#9ca3af' },
  { keys:['combo','promo'],  emoji:'🎁', grad:'135deg,#7c3aed,#a855f7,#c084fc' },
  { keys:['porcion','porcao','porcão','porciones'], emoji:'🍟', grad:'135deg,#ca8a04,#eab308,#fde047' },
  { keys:['rodizio','churrasco','carne','asado'], emoji:'🥩', grad:'135deg,#991b1b,#b91c1c,#ef4444' },
  { keys:['massa','pizza','pre-assada','preassada','revenda'], emoji:'🫓', grad:'135deg,#b45309,#d97706,#fbbf24' },
  { keys:['acompan','salad','ensalada'], emoji:'🥗', grad:'135deg,#15803d,#16a34a,#4ade80' },
  { keys:['sobremesa','doce','postre'], emoji:'🍰', grad:'135deg,#be185d,#ec4899,#f9a8d4' },
  { keys:['balcon','balcão','produto'], emoji:'🛒', grad:'135deg,#0f766e,#0d9488,#2dd4bf' },
];
const CAT_MAP = {
  pizza:'🍕',
  helad:'🍦', sorvete:'🍦', ice:'🍦',
  lanche:'🍔', burguer:'🍔', burger:'🍔', hamburgue:'🍔', hamburgu:'🍔',
  porcion:'🍟', porcao:'🍟', porcão:'🍟', porciones:'🍟',
  bebida:'🥤', refrigerante:'🥤', lata:'🥤',
  drink:'🍹',
  cerveza:'🍺', cerveja:'🍺', beer:'🍺',
  destilado:'🥃', whisky:'🥃', vodka:'🥃',
  jugo:'🍊', suco:'🍊', natural:'🍊',
  sobremesa:'🍰', doce:'🍰', postre:'🍰',
  helad:'🍦',
  combo:'🎁', promo:'🎁',
  massa:'🍝', salada:'🥗', ensalada:'🥗', acompan:'🥗',
  frango:'🍗', carne:'🥩', asado:'🥩', rodizio:'🥩',
  peixe:'🐟', sanduiche:'🥪',
};
function catEmoji(nome) {
  const n = norm(nome);
  if (n.includes('pizza') && n.includes('doce')) return '🎂';
  for (const [k, v] of Object.entries(CAT_MAP)) if (n.includes(k)) return v;
  return '🍽️';
}
function catStyle(nome) {
  const n = norm(nome);
  for (const s of CAT_STYLES) {
    if (s.keys.some(k => n.includes(k))) return s;
  }
  return { emoji:'🍽️', grad:'135deg,#475569,#64748b,#94a3b8' };
}

const PIZZA_COLORS = ['#D64000','#FF8C42','#7B1FA2','#27AE60','#1565C0','#F57C00'];
const TAM_ICO = ['🍕','🍕🍕','🍕🍕🍕','🍕🍕🍕🍕'];
function tamEmoji(nome, idx) { return TAM_ICO[Math.min(idx, 3)]; }

const BORDA_MAP = { catupiry:'🧀', cheddar:'🧀', requeijao:'🧀', cream:'🧁', chocolate:'🍫', nutella:'🍫', morango:'🍓', doce:'🍬' };
function bordaEmoji(nome) {
  const n = norm(nome);
  for (const [k, v] of Object.entries(BORDA_MAP)) if (n.includes(k)) return v;
  return '🧀';
}

function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function ehPizza(cat) { return norm(cat.nome).includes('pizza'); }
function limparTam(nome) { return nome.replace(/\s*pz\s*/gi, '').trim(); }

// ── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch(`/loja/${SLUG}`);
    if (!r.ok) throw 0;
    const d = await r.json();
    G.rest = d.restaurante; G.cardapio = d.cardapio; G.moeda = d.restaurante.moeda || 'G$';
    G.promocoes = d.promocoes || [];
    document.title = G.rest.nome;
    const hNome = document.getElementById('h-nome');
    if (hNome) hNome.textContent = G.rest.nome;
    renderHome();
    renderPromoBanner(G.promocoes);
    renderCkPag();
    carregarDadosCliente();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    ir('home');
  } catch {
    document.getElementById('loading').innerHTML = '<div style="text-align:center;padding:40px"><p style="font-size:56px">😕</p><p style="margin-top:16px;color:#888;font-size:16px">Restaurante não encontrado</p></div>';
  }
}

// ── HOME ─────────────────────────────────────────────────────────────────────
function renderHome() {
  document.getElementById('cats-grid').innerHTML = G.cardapio.map(cat => `
    <div class="cat-card${cat.imagemUrl ? ' has-img' : ''}" onclick="abrirCat('${cat.id}')">
      ${cat.imagemUrl ? `
        <img src="${cat.imagemUrl}" alt="${cat.nome}" class="c-img">
        <div class="c-overlay"></div>
      ` : `<span class="c-emoji">${catEmoji(cat.nome)}</span>`}
      <div class="c-nome">${cat.nome.replace(/\//g, '/<br>')}</div>
    </div>
  `).join('');
}

function abrirCat(catId) {
  G.catAtual = G.cardapio.find(c => c.id === catId);
  if (!G.catAtual) return;
  if (G.catAtual.tipoTamanhos === 'pizza') {
    iniciarBuilder();
  } else {
    document.getElementById('lista-titulo').textContent = G.catAtual.nome;
    renderLista();
    ir('lista');
  }
}

// ── LISTA ────────────────────────────────────────────────────────────────────
function renderLista() {
  const cat = G.catAtual;
  document.getElementById('lista-items').innerHTML = cat.produtos.map(p => {
    const minPreco = p.tamanhos?.length ? Math.min(...p.tamanhos.map(t => t.preco)) : p.preco;
    const precoTxt = p.tamanhos?.length ? `A partir de ${fmt(minPreco)}` : fmt(minPreco);
    return `
      <div class="item-card">
        ${p.imagemUrl ? `<img src="${p.imagemUrl}" class="item-img" alt="${p.nome}" loading="lazy" onclick="addItem('${p.id}')" style="cursor:pointer">` : ''}
        <div class="item-info">
          <div class="item-nome">${p.nome}</div>
          ${p.descricao ? `<div class="item-desc">${p.descricao}</div>` : ''}
          <div class="item-preco">${precoTxt}</div>
        </div>
        <button class="btn-plus" onclick="addItem('${p.id}')">+</button>
      </div>
    `;
  }).join('');
}

function addItem(pid) {
  const p = G.catAtual.produtos.find(x => x.id === pid);
  if (!p) return;
  if (p.tamanhos?.length) {
    // Usa builder simplificado de tamanho apenas (porção, custom, etc.)
    G.pizza = { tamanho: null, sabores: [{ id: p.id, nome: p.nome }], borda: false, saborBorda: null, precoBorda: 0 };
    G.passo = 1; G.temBorda = false; G.builderItemImg = p.imagemUrl || null;
    document.getElementById('bld-titulo').textContent = p.nome;
    document.getElementById('ps3').style.display = 'none';
    document.getElementById('pl2').style.display = 'none';
    setPrg(1, false);
    const tams = p.tamanhos.slice().sort((a, b) => a.preco - b.preco);
    renderTamStep(tams, false);
    document.getElementById('bld-btn').textContent = 'Adicionar ao pedido 🛍️';
    document.getElementById('bld-btn').onclick = () => {
      if (!G.pizza.tamanho) { toast('Escolha um tamanho 📏'); return; }
      addCartItem({ id:`item-${Date.now()}`, nome:`${p.nome}`, desc: G.pizza.tamanho.nome, preco: G.pizza.tamanho.preco, qt: 1, imagemUrl: p.imagemUrl||null, catNome: G.catAtual.nome });
      toast(`${p.nome} adicionado! ✓`);
      ir('lista');
    };
    ir('builder');
    return;
  }
  addCartItem({ id:`item-${Date.now()}`, nome: p.nome, desc: p.descricao||'', preco: p.preco, qt: 1, imagemUrl: p.imagemUrl||null, catNome: G.catAtual.nome });
  toast(`${p.nome} adicionado! ✓`);
}

// ── BUILDER ──────────────────────────────────────────────────────────────────
function iniciarBuilder() {
  const cat = G.catAtual;
  G.pizza = { tamanho: null, sabores: [], borda: false, saborBorda: null, precoBorda: 0, maxSabores: 2, proporcao: 'igual' };
  G.passo = 1; G.builderItemImg = null;

  // Borda vem do nível da categoria
  G.temBorda = (cat.bordas || []).length > 0;

  // Restaura step 3 (pode ter sido escondido para itens simples)
  document.getElementById('ps3').style.display = '';
  document.getElementById('pl2').style.display = '';
  if (!G.temBorda) {
    document.getElementById('ps3').style.display = 'none';
    document.getElementById('pl2').style.display = 'none';
  }

  setPrg(1, G.temBorda);
  document.getElementById('bld-titulo').textContent = `Montar ${cat.nome}`;
  document.getElementById('bld-btn').textContent = 'Próximo →';
  document.getElementById('bld-btn').onclick = avancarBuilder;

  // Tamanhos vêm do nível da categoria (JSON), não dos produtos
  const tams = (cat.tamanhos || []).slice()
    .sort((a, b) => a.preco - b.preco)
    .map((t, i) => ({ ...t, id: `cat-tam-${i}` }));
  renderTamStep(tams, true);
  ir('builder');
}

function setPrg(passo, temBorda) {
  [1,2,3].forEach(n => {
    const el = document.getElementById(`ps${n}`);
    if (!el) return;
    el.classList.remove('ativo','done');
    if (n < passo) el.classList.add('done');
    else if (n === passo) el.classList.add('ativo');
  });
  [1,2].forEach(n => {
    const el = document.getElementById(`pl${n}`);
    if (el) el.classList.toggle('done', n < passo);
  });
}

function renderTamStep(tams, pizza) {
  const html = `
    <p class="sec-title">${pizza ? 'Que tamanho vai ser? 📏' : 'Escolha o tamanho'}</p>
    <p class="sec-sub">${pizza ? 'O tamanho define o preço da pizza' : 'Selecione uma opção'}</p>
    <div class="tam-list">
      ${tams.map((t, i) => {
        if (pizza) {
          const maxS = maxSaboresParaTam(t.nome);
          const sabIco = norm(G.catAtual?.nome || '').includes('doce') ? '🎂' : '🍕';
          const icons = sabIco.repeat(Math.min(maxS, 4));
          const sabLabel = maxS === 2 ? 'até 2 sabores' : `até ${maxS} sabores`;
          return `
            <div class="tam-card" id="tam-${t.id}" onclick="selTam('${t.id}',${t.preco},'${esc(t.nome)}')">
              <div class="tam-info">
                <div class="tam-nome">${limparTam(t.nome)}</div>
                <div class="tam-sabs">${sabLabel}</div>
              </div>
              <div class="tam-right">
                <div class="tam-pizzas">${icons}</div>
                <div class="tam-preco">${fmt(t.preco)}</div>
              </div>
            </div>`;
        }
        const isMeia = /\b(meia|½|1\/2)\b/i.test(t.nome);
        const tamLeft = isMeia
          ? `<span class="tam-emoji" style="font-size:32px;font-weight:900;color:var(--prim);font-family:serif">½</span>`
          : G.builderItemImg
            ? `<img src="${G.builderItemImg}" style="width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0" alt="">`
            : `<span class="tam-emoji">${tamEmoji(t.nome, i)}</span>`;
        return `
          <div class="tam-card" id="tam-${t.id}" onclick="selTam('${t.id}',${t.preco},'${esc(t.nome)}')">
            ${tamLeft}
            <div class="tam-info">
              <div class="tam-nome">${limparTam(t.nome)}</div>
            </div>
            <div class="tam-preco">${fmt(t.preco)}</div>
          </div>`;
      }).join('')}
    </div>
    <div class="pb90"></div>
  `;
  document.getElementById('bld-content').innerHTML = html;
  if (G.pizza.tamanho) {
    const el = document.getElementById(`tam-${G.pizza.tamanho.id}`);
    if (el) el.classList.add('sel');
  }
}

function selTam(id, preco, nome) {
  const newMax = maxSaboresParaTam(nome);
  G.pizza.tamanho = { id, preco, nome: limparTam(nome) };
  if (newMax !== G.pizza.maxSabores) {
    G.pizza.maxSabores = newMax;
    G.pizza.sabores = G.pizza.sabores.slice(0, newMax); // mantém seleções dentro do novo limite
    G.pizza.proporcao = 'igual';
  }
  document.querySelectorAll('.tam-card').forEach(c => c.classList.remove('sel'));
  document.getElementById(`tam-${id}`)?.classList.add('sel');
}

function renderSabStep() {
  const cat = G.catAtual;
  const sel = G.pizza.sabores;
  const max = G.pizza.maxSabores || 2;
  const proporcao = G.pizza.proporcao || 'igual';
  const pcts = calcPercents(sel.length, proporcao);
  const selClasses = ['sel1', 'sel2', 'sel3', 'sel4'];

  let chartSection = '';
  if (sel.length >= 2) {
    const chartSvg = `<div class="pizza-chart-wrap">${pizzaChartSVG(sel, pcts)}</div>`;
    let legendSection = '';
    if (proporcao === 'principal') {
      const legendItems = sel.map((s, i) => `
        <span style="display:inline-flex;align-items:center;gap:5px">
          <span style="width:11px;height:11px;border-radius:2px;background:${PIZZA_COLORS[i % PIZZA_COLORS.length]};flex-shrink:0;display:inline-block"></span>
          <span style="font-size:12px;font-weight:${i===0?'700':'500'};color:var(--text)">${s.nome}${i===0?' <span style="color:var(--prim);font-size:10px;font-weight:700">(½)</span>':''}</span>
        </span>`).join('');
      legendSection = `
        <div style="padding:0 20px 8px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px">
          ${legendItems}
          <button onclick="trocarPrincipal()" style="display:inline-flex;align-items:center;gap:4px;background:var(--prim-bg);color:var(--prim);border:1.5px solid var(--prim);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">↺ Trocar</button>
        </div>`;
    }
    chartSection = chartSvg + legendSection;
  }

  const propToggle = sel.length >= 2 && max > 2 ? `
    <div class="prop-toggle">
      <button class="prop-btn ${proporcao === 'igual' ? 'on' : ''}" onclick="setProporcao('igual')">Partes iguais</button>
      <button class="prop-btn ${proporcao === 'principal' ? 'on' : ''}" onclick="setProporcao('principal')">½ Principal</button>
    </div>` : '';

  const subTitle = max === 2
    ? 'Pizza meia a meia!'
    : `Escolha até ${max} sabores`;

  const sabIco = norm(G.catAtual?.nome || '').includes('doce') ? '🎂' : '🍕';
  const pizzaIcons = sabIco.repeat(Math.min(max, 4));

  const html = `
    ${sel.length > 0 ? `<div class="meia-banner">${sabIco} <strong>${descSabores()}</strong></div>` : ''}
    <div style="padding:22px 20px 6px;display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-size:22px;font-weight:800;line-height:1.2">Qual o sabor? 😋</div>
        <div style="font-size:14px;color:var(--muted);margin-top:6px">${subTitle}</div>
      </div>
      <div style="font-size:28px;line-height:1;letter-spacing:-6px;padding-top:2px">${pizzaIcons}</div>
    </div>
    ${chartSection}
    ${propToggle}
    <div class="sab-list">
      ${cat.produtos.map(p => {
        const idx = sel.findIndex(s => s.id === p.id);
        const cls = idx >= 0 ? selClasses[Math.min(idx, 3)] : '';
        const chk = idx >= 0 ? (sel.length === 1 ? '✓' : fmtPct(pcts[idx])) : '';
        const tag = idx > 0 ? `<span class="sab-tag">${idx + 1}º</span>` : '';
        return `
          <div class="sab-card ${cls}" onclick="selSab('${p.id}','${esc(p.nome)}')">
            <div class="sab-chk">${chk}</div>
            ${p.imagemUrl ? `<img src="${p.imagemUrl}" class="sab-img" alt="${p.nome}" loading="lazy">` : ''}
            <div class="sab-info">
              <div class="sab-nome">${p.nome}</div>
              ${p.descricao ? `<div class="sab-desc-wrap">${p.descricao}</div>` : ''}
            </div>
            ${tag}
          </div>
        `;
      }).join('')}
    </div>
    <div class="pb90"></div>
  `;
  document.getElementById('bld-content').innerHTML = html;
}

// ── Proporções de sabores ────────────────────────────────────────────────────
function maxSaboresParaTam(nome) {
  const m = (nome || '').match(/at[eé]\s+(\d+)\s+sabores?/i);
  return m ? parseInt(m[1]) : 2;
}
function calcPercents(n, proporcao) {
  if (n <= 0) return [];
  if (n === 1) return [1];
  if (n === 2) return [0.5, 0.5];
  if (proporcao === 'principal') {
    const rest = 0.5 / (n - 1); // 1º ocupa 50%, demais dividem os outros 50%
    return [0.5, ...Array(n - 1).fill(rest)];
  }
  return Array(n).fill(1 / n); // partes iguais
}
function fmtPct(decimal) { return Math.round(decimal * 100) + '%'; }
function setProporcao(mode) { G.pizza.proporcao = mode; renderSabStep(); }
function trocarPrincipal() {
  if (G.pizza.sabores.length < 2) return;
  G.pizza.sabores.push(G.pizza.sabores.shift());
  renderSabStep();
}

function pizzaChartSVG(sabores, pcts, px = 150) {
  if (!sabores.length) return '';
  const cx = 80, cy = 80, R = 70, Rc = 79;
  let svg = `<svg viewBox="0 0 160 160" class="pizza-chart" style="width:${px}px;height:${px}px">`;
  svg += `<circle cx="${cx}" cy="${cy}" r="${Rc}" fill="#C8A456"/>`;
  if (sabores.length === 1) {
    svg += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${PIZZA_COLORS[0]}"/>`;
    svg += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="14" font-weight="800" font-family="-apple-system,sans-serif">100%</text>`;
  } else {
    let angle = -Math.PI / 2;
    const paths = [], labels = [];
    pcts.forEach((pct, i) => {
      const sweep = pct * 2 * Math.PI;
      const end = angle + sweep;
      const mid = angle + sweep / 2;
      const x1 = (cx + R * Math.cos(angle)).toFixed(2);
      const y1 = (cy + R * Math.sin(angle)).toFixed(2);
      const x2 = (cx + R * Math.cos(end)).toFixed(2);
      const y2 = (cy + R * Math.sin(end)).toFixed(2);
      const large = sweep > Math.PI ? 1 : 0;
      paths.push(`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} Z" fill="${PIZZA_COLORS[i % PIZZA_COLORS.length]}" stroke="white" stroke-width="2.5"/>`);
      if (pct >= 0.10) {
        const lx = (cx + R * 0.60 * Math.cos(mid)).toFixed(1);
        const ly = (cy + R * 0.60 * Math.sin(mid)).toFixed(1);
        labels.push(`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="12" font-weight="800" font-family="-apple-system,sans-serif">${fmtPct(pct)}</text>`);
      }
      angle = end;
    });
    svg += paths.join('') + labels.join('');
  }
  svg += `<circle cx="${cx}" cy="${cy}" r="8" fill="rgba(0,0,0,0.18)"/>`;
  svg += `</svg>`;
  return svg;
}

function descSabores() {
  const s = G.pizza.sabores;
  if (!s.length) return '';
  if (s.length === 1) return s[0].nome;
  const pcts = calcPercents(s.length, G.pizza.proporcao);
  return pcts.map((p, i) => `${fmtPct(p)} ${s[i].nome}`).join(' + ');
}

function selSab(id, nome) {
  const max = G.pizza.maxSabores || 2;
  const idx = G.pizza.sabores.findIndex(s => s.id === id);
  if (idx >= 0) {
    G.pizza.sabores.splice(idx, 1);
    if (G.pizza.sabores.length < 2) G.pizza.proporcao = 'igual';
  } else {
    if (G.pizza.sabores.length >= max) { toast(`Máximo ${max} sabores para este tamanho 🍕`); return; }
    G.pizza.sabores.push({ id, nome });
  }
  renderSabStep();
}

function renderBordaStep() {
  const cat = G.catAtual;
  const tam = G.pizza.tamanho;
  const tamIdx = (cat.tamanhos || []).findIndex(t => t.nome === tam.nome);
  const comBorda = G.pizza.borda;

  const saboresHtml = comBorda ? `
    <div class="borda-sab-title">Qual sabor de borda?</div>
    <div class="borda-sab-grid">
      ${(cat.bordas || []).map(b => {
        const precoExtra = (tamIdx >= 0 && b.precos?.[tamIdx]) ? b.precos[tamIdx] : 0;
        return `
          <div class="bsab-card ${G.pizza.saborBorda === b.nome ? 'sel' : ''}" onclick="selSaborBordaDireto('${esc(b.nome)}', ${precoExtra})">
            <span class="bs-emoji">${bordaEmoji(b.nome)}</span>
            <div class="bs-nome">${b.nome}</div>
            ${precoExtra > 0 ? `<div style="font-size:11px;color:var(--prim);margin-top:4px;font-weight:700">+ ${fmt(precoExtra)}</div>` : ''}
          </div>
        `;
      }).join('')}
    </div>
  ` : '';

  const html = `
    <p class="sec-title">Quer borda recheada? 🧀</p>
    <p class="sec-sub">Escolha uma opção</p>
    <div class="borda-opts">
      <div class="borda-card ${comBorda ? 'sel' : ''}" onclick="selBorda(true)">
        <span class="b-emoji">🧀</span>
        <div class="b-nome">Com Borda Recheada</div>
        <div class="b-desc">Escolha o sabor a seguir</div>
      </div>
    </div>
    ${saboresHtml}
    <div class="borda-opts" style="margin-top:20px">
      <div class="borda-card ${!comBorda ? 'sel' : ''}" onclick="selBorda(false)">
        <span class="b-emoji">⭕</span>
        <div class="b-nome">Sem Borda</div>
        <div class="b-desc">Pizza clássica</div>
      </div>
    </div>
    <div class="pb90"></div>
  `;
  document.getElementById('bld-content').innerHTML = html;
}

function selBorda(v) {
  G.pizza.borda = v;
  if (!v) { G.pizza.saborBorda = null; G.pizza.precoBorda = 0; }
  renderBordaStep();
}

function selSaborBordaDireto(nome, precoExtra) {
  G.pizza.borda = true;
  G.pizza.saborBorda = nome;
  G.pizza.precoBorda = precoExtra;
  renderBordaStep();
}

function avancarBuilder() {
  const p = G.passo;
  if (p === 1) {
    if (!G.pizza.tamanho) { toast('Escolha um tamanho primeiro 📏'); return; }
    G.passo = 2; setPrg(2, G.temBorda);
    renderSabStep();
    document.getElementById('bld-btn').textContent = G.temBorda ? 'Próximo →' : 'Adicionar ao pedido 🛍️';
  } else if (p === 2) {
    if (!G.pizza.sabores.length) { toast('Escolha pelo menos 1 sabor 🍕'); return; }
    if (G.temBorda) {
      G.passo = 3; setPrg(3, true);
      renderBordaStep();
      document.getElementById('bld-btn').textContent = 'Adicionar ao pedido 🛍️';
    } else {
      finalizarPizza();
    }
  } else if (p === 3) {
    if (G.pizza.borda && !G.pizza.saborBorda) { toast('Escolha o sabor da borda 🧀'); return; }
    finalizarPizza();
  }
}

function voltarBuilder() {
  if (G.passo === 1) { ir('home'); return; }
  G.passo--;
  setPrg(G.passo, G.temBorda);
  document.getElementById('bld-btn').onclick = avancarBuilder;
  document.getElementById('bld-btn').textContent = G.temBorda ? 'Próximo →' : (G.passo === 2 ? 'Adicionar ao pedido 🛍️' : 'Próximo →');
  if (G.passo === 1) {
    const tams = (G.catAtual.tamanhos || []).slice()
      .sort((a, b) => a.preco - b.preco)
      .map((t, i) => ({ ...t, id: `cat-tam-${i}` }));
    renderTamStep(tams, true);
    document.getElementById('bld-btn').textContent = 'Próximo →';
  } else if (G.passo === 2) {
    renderSabStep();
    document.getElementById('bld-btn').textContent = G.temBorda ? 'Próximo →' : 'Adicionar ao pedido 🛍️';
  }
}

function finalizarPizza() {
  const tam = G.pizza.tamanho;
  let preco = tam.preco;
  if (G.pizza.borda && G.pizza.precoBorda) preco += G.pizza.precoBorda;

  const nomeSab = descSabores();
  const bordaTxt = G.pizza.borda ? ` · Borda ${G.pizza.saborBorda||'Recheada'}` : '';
  const desc = `${tam.nome} · ${nomeSab}${bordaTxt}`;
  const isDoce = norm(G.catAtual.nome).includes('doce');
  const catLabel = isDoce ? 'Pizza Doce' : 'Pizza';
  const pizzaIco = isDoce ? '🎂' : '🍕';

  addCartItem({ id:`pizza-${Date.now()}`, nome:`${pizzaIco} ${catLabel}`, desc, preco, qt: 1, catNome: G.catAtual.nome });

  setTimeout(() => abrirModalContinuar(), 300);
}

function abrirModalContinuar() {
  const ico = norm(G.catAtual?.nome || '').includes('doce') ? '🎂' : '🍕';
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'ov-cont';
  ov.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-ico">${ico}</div>

function setEntrega(v) {

  document.getElementById('t-ret').classList.toggle('on', v === 'retirada');
  document.getElementById('fg-end').style.display = v === 'delivery' ? 'block' : 'none';
}

function calcularOpcoesTroco(total) {
  const opts = new Set();
  opts.add(Math.ceil((total + 1) / 50000) * 50000);
  opts.add(Math.ceil((total + 1) / 100000) * 100000);
  const arr = [...opts].sort((a, b) => a - b);
  if (arr.length < 2) arr.push(arr[arr.length - 1] + 100000);
  return arr.slice(0, 2);
}

function renderTroco() {
  const sub = G.cart.reduce((a, i) => a + i.preco * i.qt, 0);
  const taxa = G.entrega === 'delivery' ? (G.rest.taxaEntrega || 0) : 0;
  const total = sub + taxa;
  const opcoes = calcularOpcoesTroco(total);
  const lbl = document.getElementById('troco-lbl');
  if (lbl) lbl.textContent = `Total do pedido: ${fmt(total)}`;
  document.getElementById('troco-opts').innerHTML = [
    ...opcoes.map(v => `<button class="troco-btn${G.troco === v ? ' on' : ''}" onclick="setTroco(${v})">${fmt(v)}</button>`),
    `<button class="troco-btn${G.troco === 'custom' ? ' on' : ''}" onclick="setTroco('custom')">✏️ Personalizado</button>`,
  ].join('');
}

function setTroco(v) {
  G.troco = v;
  renderTroco();
  const customDiv = document.getElementById('troco-custom');
  if (v === 'custom') {
    customDiv.style.display = 'block';
    document.getElementById('troco-inp').focus();
  } else {
    customDiv.style.display = 'none';
  }
}

function setPag(v) {
  G.pagamento = v;
  document.querySelectorAll('.pag-btn').forEach(b => b.classList.remove('on'));
  document.getElementById(`pag-${v}`)?.classList.add('on');
  const pix = document.getElementById('pix-box');
  const trocoBox = document.getElementById('troco-box');
  if (v === 'transferencia' && G.rest.dadosTransferencia) {
    pix.textContent = G.rest.dadosTransferencia;
    pix.style.display = 'block';
  } else {
    pix.style.display = 'none';
  }
  if (v === 'dinheiro') {
    G.troco = null;
    renderTroco();
    trocoBox.style.display = 'block';
    setTimeout(() => {
      const rect = trocoBox.getBoundingClientRect();
      const botBar = document.querySelector('#s-checkout .bot-action');
      const botH = botBar ? botBar.offsetHeight : 130;
      const visBottom = window.innerHeight - botH - 16;
      if (rect.bottom > visBottom) {
        window.scrollBy({ top: rect.bottom - visBottom, behavior: 'smooth' });
      }
    }, 50);
  } else {
    trocoBox.style.display = 'none';
    G.troco = null;
  }
}

async function finalizar() {
  const nome = document.getElementById('ck-nome').value.trim();
  const tel  = document.getElementById('ck-tel').value.trim().replace(/\D/g,'');
  const end  = document.getElementById('ck-end')?.value.trim();

  if (!nome)  { toast('Informe seu nome 👤'); return; }
  if (tel.length < 8) { toast('Informe seu WhatsApp 📱'); return; }
  if (G.entrega === 'delivery' && !end && !G.geoLink) { toast('Informe o endereço 📍'); return; }
  if (!G.pagamento) { toast('Escolha como vai pagar 💳'); return; }

  let trocoPara = null;
  if (G.pagamento === 'dinheiro' && G.troco != null) {
    if (G.troco === 'custom') {
      const v = parseInt((document.getElementById('troco-inp').value || '').replace(/\D/g, ''), 10);
      if (!isNaN(v) && v > 0) trocoPara = v;
    } else {
      trocoPara = G.troco;
    }
  }

  const btn = document.getElementById('btn-fin');
  btn.disabled = true; btn.textContent = 'Enviando...';

  try {
    const itens = G.cart.map(i => ({
      nome: i.desc ? `${i.nome} (${i.desc})` : i.nome,
      preco: i.preco,
      quantidade: i.qt,
    }));
    const res = await fetch(`/loja/${SLUG}/pedido`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clienteNome: nome, clienteNumero: tel,
        itens, tipoEntrega: G.entrega,
        endereco: G.entrega === 'delivery'
          ? [end || G.geoAddr || '', G.geoLink ? `📍 ${G.geoLink}` : ''].filter(Boolean).join('\n')
          : '',
        metodoPagamento: G.pagamento,
        trocoPara,
      }),
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.erro || `HTTP ${res.status}`);
    }
    const data = await res.json();

    const numeroPedido = data.numeroPedido || '';
    document.getElementById('conf-num').textContent = numeroPedido || '—';
    document.getElementById('conf-msg').textContent =
      G.entrega === 'delivery'
        ? 'Logo nosso entregador estará aí com seu pedido! 🛵'
        : 'Pode vir buscar em alguns minutinhos! 🏃';
    const waMsg = `Olá! Quero acompanhar meu pedido #${numeroPedido}`;
    document.getElementById('btn-whatsapp-pedido').href = `https://wa.me/${G.rest.whatsappPublico || SLUG}?text=${encodeURIComponent(waMsg)}`;

    G.cart = []; sync();
    salvarDadosCliente();
    ir('conf');
  } catch(e) {
    console.error('[finalizar]', e);
    toast('Erro: ' + ((e instanceof Error ? e.message : null) || 'Tente de novo!'));
    btn.disabled = false; btn.textContent = 'Fazer pedido 🎉';
  }
}

function recomecar() {
  G.pagamento = ''; G.entrega = 'delivery'; G.geoLink = null; G.geoAddr = null; G.troco = null;
  document.getElementById('troco-box').style.display = 'none';
  document.getElementById('geo-preview').style.display = 'none';
  const gBtn = document.getElementById('btn-geo');
  if (gBtn) { gBtn.className = 'btn-geo'; document.getElementById('geo-ico').textContent = '📍'; document.getElementById('geo-txt').textContent = 'Compartilhar localização exata'; }
  carregarDadosCliente();
  document.getElementById('fg-end').style.display = 'block';
  document.getElementById('t-del').classList.add('on');
  document.getElementById('t-ret').classList.remove('on');
  document.getElementById('pix-box').style.display = 'none';
  document.querySelectorAll('.pag-btn').forEach(b => b.classList.remove('on'));
  ir('home');
}

function salvarDadosCliente() {
  const nome = document.getElementById('ck-nome')?.value.trim();
  const tel  = document.getElementById('ck-tel')?.value.trim();
  const end  = document.getElementById('ck-end')?.value.trim();
  if (nome) localStorage.setItem('cl_nome', nome);
  if (tel)  localStorage.setItem('cl_tel',  tel);
  if (end)  localStorage.setItem('cl_end',  end);
}

function carregarDadosCliente() {
  const nome = localStorage.getItem('cl_nome');
  const tel  = localStorage.getItem('cl_tel');
  const end  = localStorage.getItem('cl_end');
  const fNome = document.getElementById('ck-nome');
  const fTel  = document.getElementById('ck-tel');
  const fEnd  = document.getElementById('ck-end');
  if (nome && fNome) fNome.value = nome;
  if (tel  && fTel)  fTel.value  = tel;
  if (end  && fEnd)  fEnd.value  = end;
}

// ── Geolocalização ────────────────────────────────────────────────────────────
function usarLocalizacao() {
  if (!navigator.geolocation) { toast('Seu navegador não suporta geolocalização'); return; }
  const btn = document.getElementById('btn-geo');
  const ico = document.getElementById('geo-ico');
  const txt = document.getElementById('geo-txt');

  btn.className = 'btn-geo loading';
  ico.textContent = '⏳';
  txt.textContent = 'Obtendo GPS...';
  document.getElementById('geo-preview').style.display = 'none';
  G.geoLink = null;

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude: lat, longitude: lon, accuracy } = pos.coords;
      const mapsUrl = `https://maps.google.com/?q=${lat},${lon}`;
      G.geoLink = mapsUrl;

      txt.textContent = 'Identificando endereço...';

      let enderecoTxt = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
      try {
        const r = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`,
          { headers: { 'Accept-Language': 'pt-BR,pt' } }
        );
        const d = await r.json();
        const a = d.address || {};
        const partes = [
          a.road || a.pedestrian || a.footway || a.path || '',
          a.house_number || '',
          a.suburb || a.neighbourhood || a.quarter || a.village || '',
          a.city || a.town || a.municipality || a.county || '',
        ].filter(Boolean);
        if (partes.length) enderecoTxt = partes.join(', ');
      } catch { /* usa coords como fallback */ }

      // Salva e auto-preenche o campo de endereço
      G.geoAddr = enderecoTxt;
      const endField = document.getElementById('ck-end');
      if (endField && !endField.value.trim()) endField.value = enderecoTxt;

      // Mostra preview
      document.getElementById('geo-addr').textContent = enderecoTxt;
      document.getElementById('geo-coords').textContent =
        `${lat.toFixed(5)}, ${lon.toFixed(5)} · precisão ~${Math.round(accuracy)}m`;
      document.getElementById('geo-link').href = mapsUrl;
      document.getElementById('geo-preview').style.display = 'block';

      btn.className = 'btn-geo ok';
      ico.textContent = '✓';
      txt.textContent = 'Localização capturada — atualizar';
    },
    (err) => {
      const msgs = {
        1: 'Permissão negada. Informe o endereço manualmente.',
        2: 'GPS indisponível no momento.',
        3: 'Tempo esgotado. Tente novamente.',
      };
      btn.className = 'btn-geo err';
      ico.textContent = '⚠️';
      txt.textContent = msgs[err.code] || 'Não foi possível obter localização.';
      setTimeout(() => {
        btn.className = 'btn-geo';
        ico.textContent = '📍';
        txt.textContent = 'Tentar novamente';
      }, 4000);
    },
    { timeout: 12000, enableHighAccuracy: true, maximumAge: 0 }
  );
}

const PROMO_EMOJIS = { MANUAL:'🏷️', DESCONTO:'💰', COMPRE_PAGUE:'🛒', BRINDE:'🎁' };

function renderPromoBanner(promocoes) {
  const band = document.getElementById('promo-band');
  const track = document.getElementById('promo-scroll');
  const btnVer = document.getElementById('promo-ticker-ver');
  if (!promocoes || !promocoes.length) { band.classList.add('hidden'); return; }

  const moeda = G.moeda || 'G$';
  const segmentos = promocoes.map(p => {
    const ico = PROMO_EMOJIS[p.tipo] || '🏷️';
    let txt = p.nome;
    if (p.descricao) txt += ' — ' + p.descricao;
    if (p.precoPromocional != null)
      txt += ' por ' + moeda + ' ' + Number(p.precoPromocional).toLocaleString('pt-BR');
    return `<span class="promo-ticker-item" onclick="abrirPromoModal('${p.id}')">${ico} ${txt}</span><span class="promo-ticker-sep">✦</span>`;
  }).join('');

  // Duplicar conteúdo para loop contínuo sem pausa
  track.innerHTML = segmentos + segmentos;

  // Velocidade proporcional ao texto (px/s constante)
  const totalChars = promocoes.reduce((a, p) => a + p.nome.length + (p.descricao || '').length, 0);
  track.style.animationDuration = Math.max(10, totalChars * 0.35) + 's';

  if (btnVer) btnVer.onclick = () => abrirPromoModal(promocoes[0].id);

  band.classList.remove('hidden');
}

let _promoAtualId = null;
let _promoItensSelec = [];

function abrirPromoModal(id) {
  const p = (G.promocoes || []).find(x => x.id === id);
  if (!p) return;
  _promoAtualId = id;
  _promoItensSelec = [];
  document.getElementById('pm-nome').textContent = p.nome;
  document.getElementById('pm-desc').textContent = p.descricao || '';
  const body = document.getElementById('pm-body');
  const itens = Array.isArray(p.itens) ? p.itens : [];
  if (!itens.length) {
    body.innerHTML = '<p style="color:#999;font-size:14px;text-align:center;padding:24px 0">Esta promoção não tem itens específicos associados.</p>';
  } else {
    const moeda = G.moeda || 'G$';
    const temPrecoPromo = p.precoPromocional != null;
    body.innerHTML = `<p style="font-size:13px;color:#888;margin-bottom:14px;">Selecione o(s) item(ns) que deseja adicionar ao pedido${temPrecoPromo ? ` por <strong style="color:#D64000">${moeda} ${Number(p.precoPromocional).toLocaleString('pt-BR')} cada</strong>` : ''}:</p>` +
      itens.map((it, i) => {
        const precoBase = temPrecoPromo ? p.precoPromocional : it.preco;
        const precoFmt = precoBase != null ? `${moeda} ${Number(precoBase).toLocaleString('pt-BR', {minimumFractionDigits:0})}` : '';
        const precoOrigFmt = temPrecoPromo && it.preco ? `<span style="text-decoration:line-through;color:#bbb;font-size:11px;margin-right:4px">${moeda} ${Number(it.preco).toLocaleString('pt-BR', {minimumFractionDigits:0})}</span>` : '';
        return `<div class="promo-item-card" id="pic-${i}" onclick="togglePromoItem(${i})">
          <div style="flex:1">
            <div class="promo-item-card-name">${esc(it.nome)}</div>
          </div>
          <div class="promo-item-card-preco">${precoOrigFmt}${precoFmt}</div>
          <div class="promo-item-check" id="pic-chk-${i}"></div>
        </div>`;
      }).join('');
  }
  document.getElementById('promo-modal').classList.add('on');
  atualizarBtnPromo();
}

function togglePromoItem(i) {
  const idx = _promoItensSelec.indexOf(i);
  const card = document.getElementById(`pic-${i}`);
  const chk = document.getElementById(`pic-chk-${i}`);
  if (idx === -1) {
    _promoItensSelec.push(i);
    card.classList.add('sel');
    chk.textContent = '✓';
  } else {
    _promoItensSelec.splice(idx, 1);
    card.classList.remove('sel');
    chk.textContent = '';
  }
  atualizarBtnPromo();
}

function atualizarBtnPromo() {
  const btn = document.getElementById('pm-btn-add');
  const n = _promoItensSelec.length;
  btn.disabled = n === 0;
  btn.textContent = n > 0 ? `Adicionar ${n} item${n > 1 ? 's' : ''} ao pedido` : 'Adicionar ao pedido';
}

function fecharPromoModal() {
  document.getElementById('promo-modal').classList.remove('on');
  _promoAtualId = null;
  _promoItensSelec = [];
}

function adicionarItensPromo() {
  const p = (G.promocoes || []).find(x => x.id === _promoAtualId);
  if (!p) return;
  const itens = Array.isArray(p.itens) ? p.itens : [];
  const n = _promoItensSelec.length;
  _promoItensSelec.forEach(i => {
    const it = itens[i];
    if (!it) return;
    const preco = p.precoPromocional != null ? Number(p.precoPromocional) : (it.preco != null ? Number(it.preco) : 0);
    addCartItem({ nome: it.nome, preco, qt: 1, desc: `Promoção: ${p.nome}` });
  });
  fecharPromoModal();
  toast(`${n === 1 ? 'Item adicionado' : `${n} itens adicionados`} ao pedido!`);
}

init();

// ── Back button (mobile) ─────────────────────────────────────────────────────
let _allowExit = false;
history.pushState({ app: true }, '');
function _sairDoApp() {
  document.getElementById('ov-sair')?.remove();
  _allowExit = true;
  history.back();
}
window.addEventListener('popstate', () => {
  if (_allowExit) { _allowExit = false; return; }
  if (document.getElementById('ov-sair')) return;
  history.pushState({ app: true }, '');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'ov-sair';
  ov.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-ico">👋</div>
      <p class="modal-title">Sair do app?</p>
      <p class="modal-sub">Seu pedido ainda está aqui se você voltar!</p>
      <div class="modal-btns">
        <button class="btn-prim" onclick="document.getElementById('ov-sair').remove()">Ficar no app</button>
        <button class="btn-ghost" onclick="_sairDoApp()">Sair mesmo assim</button>
      </div>
    </div>
  `;
  document.body.appendChild(ov);
});
</script>
</body>
</html>
